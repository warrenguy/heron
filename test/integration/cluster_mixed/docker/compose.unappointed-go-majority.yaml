# Overlay: no appointed leader. Java member 0, Go members 1 and 2.
# Use with: docker compose -f compose.yaml -f compose.unappointed-go-majority.yaml
#
# An inactive profile keeps cluster-1 down.
# Java member 0 cannot form a quorum alone.

services:
  go:
    command: ["-test.timeout=120s", "-test.run", "^TestClusterMixedUnappointedGoMajority$$"]
    depends_on:
      cluster-0:
        condition: service_healthy
      aeronmd-1:
        condition: service_healthy
      archive-go-1:
        condition: service_healthy
    environment:
      LUAS_CLUSTER_MIXED_UNAPPOINTED_GO_MAJORITY_COMPOSE: "1"
    volumes:
      - cluster-data-1:/tmp/luas-cluster-1

  cluster-0:
    environment:
      LUAS_CLUSTER_APPOINTED_LEADER_ID: "-1"
      AERON_CLUSTER_STARTUP_CANVASS_TIMEOUT: "120s"

  cluster-1:
    profiles: ["java-member-1"]

  # Go member 1 driver and archive. Each extends its base service with the
  # member-1 address and directories.
  aeronmd-1:
    extends:
      file: compose.yaml
      service: aeronmd
    hostname: aeronmd-1
    networks:
      cluster-mixed:
        ipv4_address: ${LUAS_CLUSTER_MIXED_IP1:-172.30.0.11}
    environment:
      AERON_DIR: /dev/shm/aeron-go1
    healthcheck:
      test: ["CMD-SHELL", "test -f /dev/shm/aeron-go1/cnc.dat"]

  archive-go-1:
    extends:
      file: compose.yaml
      service: archive-go
    build: !reset null
    hostname: archive-go-1
    environment:
      AERON_DIR: /dev/shm/aeron-go1
      LUAS_ARCHIVE_DIR: /tmp/luas-archive-go1
    volumes: !override
      - aeron-media:/dev/shm
      - archive-data-go1:/tmp/luas-archive-go1
    depends_on: !override
      aeronmd-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/luas-archive-go1/.luas-archive-ready"]

volumes:
  archive-data-go1:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=256m,mode=1777"
