# Base mixed cluster layout. The base file does not add a cross-language
# depends_on. An overlay supplies the start order: java-leader, go-leader,
# or ex-leader-rejoin.
#
# Per-run env from the smoke script:
# - HERON_COMPOSE_PROJECT
# - HERON_CLUSTER_MIXED_SUBNET
# - HERON_CLUSTER_MIXED_IP{0,1,2}
# - HERON_CLUSTER_HOSTNAMES (optional; defaults to the three IP vars)
#
# Unset env keeps the 172.30.0.0/24 manual topology.
#
# HERON_CLUSTER_HOSTNAMES must match the bridge ipv4_address values.
# When only the IP vars are set, the member list defaults from those IPs.
# Compose does not cross-check an explicit HOSTNAMES override against the IPs.
#
# Each smoke picks a per-run /24 under 172.30.0.0/16.
#
# Docker IPAM is daemon-global. An overlapping pool fails compose up.
# The smoke then retries with another /24.
#
# Multicast log interface=172.30.0.0/16 covers every subnet.

name: ${HERON_COMPOSE_PROJECT:-heron-cluster-mixed}

x-app-user: &app-user "${HERON_COMPOSE_UID:-1000}:${HERON_COMPOSE_GID:-1000}"

x-aeron-term-env: &aeron-term-env
  AERON_TERM_BUFFER_LENGTH: "65536"
  AERON_IPC_TERM_BUFFER_LENGTH: "65536"

x-mixed-cluster-env: &mixed-cluster-env
  HERON_CLUSTER_MIXED: "1"
  HERON_CLUSTER_MEMBER_COUNT: "3"
  HERON_CLUSTER_HOSTNAMES: ${HERON_CLUSTER_HOSTNAMES:-${HERON_CLUSTER_MIXED_IP0:-172.30.0.10},${HERON_CLUSTER_MIXED_IP1:-172.30.0.11},${HERON_CLUSTER_MIXED_IP2:-172.30.0.12}}
  <<: *aeron-term-env

x-java-healthcheck: &java-healthcheck
  interval: 1s
  timeout: 5s
  retries: 15
  start_period: 30s

# One shared /dev/shm parent for three drivers and the readiness file.
# size=1536m = 3 x 512m failover per-member shm. Holds three concurrent AERON_DIR trees.
x-shm-tmpfs-opts: &shm-tmpfs-opts
  type: tmpfs
  device: tmpfs
  o: "size=1536m,mode=1777"

# Java baseDir holds embedded Archive segments under archive/. Archive low
# storage threshold is 128MiB, so 64m fails startLogRecording. 256m matches
# archive_java archive-data and single-node cluster shm.
x-cluster-data-tmpfs-opts: &cluster-data-tmpfs-opts
  type: tmpfs
  device: tmpfs
  o: "size=256m,mode=1777"

networks:
  cluster-mixed:
    driver: bridge
    ipam:
      config:
        - subnet: ${HERON_CLUSTER_MIXED_SUBNET:-172.30.0.0/24}

services:
  # Holds the member-2 address (HERON_CLUSTER_MIXED_IP2). The Go test joins this
  # driver and shares its network namespace. The C driver listens on the member-2
  # consensus and log endpoints named in the members string.
  aeronmd:
    image: java-interop-aeronmd
    user: *app-user
    hostname: aeronmd
    networks:
      cluster-mixed:
        ipv4_address: ${HERON_CLUSTER_MIXED_IP2:-172.30.0.12}
    environment:
      <<: *aeron-term-env
      AERON_DIR: /dev/shm/aeron-go
      # Disable endpoint name re-resolution. Address literals stay static. Keep the
      # long check interval used on the failover path for publication-add stability.
      AERON_DRIVER_RERESOLUTION_CHECK_INTERVAL: "3600000000000"
    volumes:
      - aeron-media:/dev/shm
    healthcheck:
      test: ["CMD-SHELL", "test -f /dev/shm/aeron-go/cnc.dat"]
      interval: 1s
      timeout: 5s
      retries: 10
      start_period: 5s

  cluster-0:
    image: cluster-java-cluster
    build:
      context: ../../../..
      dockerfile: test/integration/cluster_java/docker/java/Dockerfile
    user: *app-user
    hostname: cluster-0
    networks:
      cluster-mixed:
        ipv4_address: ${HERON_CLUSTER_MIXED_IP0:-172.30.0.10}
    environment:
      <<: *mixed-cluster-env
      HERON_CLUSTER_MEMBER_ID: "0"
      AERON_DIR: /dev/shm/aeron-j0
    volumes:
      - aeron-media:/dev/shm
      - cluster-data-0:/tmp/heron-cluster-0
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "test -f /dev/shm/aeron-j0/cnc.dat"]

  # cluster-java-cluster image is built by cluster-0; cluster-1 reuses that tag.
  cluster-1:
    image: cluster-java-cluster
    user: *app-user
    hostname: cluster-1
    networks:
      cluster-mixed:
        ipv4_address: ${HERON_CLUSTER_MIXED_IP1:-172.30.0.11}
    environment:
      <<: *mixed-cluster-env
      HERON_CLUSTER_MEMBER_ID: "1"
      AERON_DIR: /dev/shm/aeron-j1
    volumes:
      - aeron-media:/dev/shm
      - cluster-data-1:/tmp/heron-cluster-1
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "test -f /dev/shm/aeron-j1/cnc.dat"]

  # Go member archive server. Shares the go AERON_DIR with aeronmd so the Go
  # client reaches control over local IPC. Java members embed their own Archives.
  archive-go:
    image: archive-java-archive
    build:
      context: ../../../..
      dockerfile: test/integration/archive_java/docker/java/Dockerfile
    user: *app-user
    hostname: archive-go
    environment:
      <<: *aeron-term-env
      AERON_DIR: /dev/shm/aeron-go
      HERON_ARCHIVE_DIR: /tmp/heron-archive-go
      # Distinct UDP bind. Go control client uses local IPC, not this channel.
      HERON_ARCHIVE_CONTROL_CHANNEL: "aeron:udp?endpoint=127.0.0.1:9210"
    volumes:
      - aeron-media:/dev/shm
      - archive-data-go:/tmp/heron-archive-go
    depends_on:
      aeronmd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/heron-archive-go/.heron-archive-ready"]
      interval: 1s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Go member 2. Shares the aeronmd network namespace: the member-2 endpoints
  # on HERON_CLUSTER_MIXED_IP2 must listen in the C driver process.
  #
  # Volumes stay independent. The overlay sets command, gate env, and start order.
  go:
    image: cluster-mixed-go
    build:
      context: ../../../..
      dockerfile: test/integration/docker/go/Dockerfile
      args:
        - GO_VERSION
        - SUITE=cluster_mixed
    user: *app-user
    network_mode: "service:aeronmd"
    depends_on:
      aeronmd:
        condition: service_healthy
      archive-go:
        condition: service_healthy
    environment:
      <<: *aeron-term-env
      AERON_DIR: /dev/shm/aeron-go
      # Member list matches the Java peers.
      HERON_CLUSTER_HOSTNAMES: ${HERON_CLUSTER_HOSTNAMES:-${HERON_CLUSTER_MIXED_IP0:-172.30.0.10},${HERON_CLUSTER_MIXED_IP1:-172.30.0.11},${HERON_CLUSTER_MIXED_IP2:-172.30.0.12}}
    volumes:
      - aeron-media:/dev/shm
      - cluster-data-2:/tmp/heron-cluster-2
    healthcheck:
      interval: 1s
      timeout: 5s
      retries: 60
      start_period: 5s
      test: ["CMD-SHELL", "test -f /dev/shm/heron-mixed/member-ready"]

volumes:
  aeron-media:
    driver: local
    driver_opts: *shm-tmpfs-opts

  cluster-data-0:
    driver: local
    driver_opts: *cluster-data-tmpfs-opts

  cluster-data-1:
    driver: local
    driver_opts: *cluster-data-tmpfs-opts

  cluster-data-2:
    driver: local
    driver_opts: *cluster-data-tmpfs-opts

  archive-data-go:
    driver: local
    driver_opts: *cluster-data-tmpfs-opts
