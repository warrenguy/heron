# Overlay: Java appointed leader. The Go member restarts from its snapshot.
# Use with: docker compose -f compose.yaml -f compose.java-leader.yaml \
#   -f compose.java-leader-snapshot.yaml

services:
  go:
    command: ["-test.timeout=300s", "-test.run", "^TestClusterMixedJavaLeaderSnapshotRestart$$"]
    environment:
      HERON_CLUSTER_MIXED_JAVA_LEADER_COMPOSE: "0"
      HERON_CLUSTER_MIXED_JAVA_LEADER_SNAPSHOT_COMPOSE: "1"
