# Overlay: Go appointed leader (member 2). Java peers start first.
# Use with: docker compose -f compose.yaml -f compose.go-leader.yaml
#
# Start order:
# 1. aeronmd healthy
# 2. archive-go healthy
# 3. cluster-0 and cluster-1 healthy (cnc.dat present)
# 4. go records Java commit counters, opens as appointed leader
# Java peers must not elect a term while the Go member is absent.
# Appointed leader 2 and a raised startup canvass timeout hold peers in canvass.

services:
  go:
    command: ["-test.timeout=120s", "-test.run", "^TestClusterMixedGoLeader$$"]
    depends_on:
      cluster-0:
        condition: service_healthy
      cluster-1:
        condition: service_healthy
    environment:
      HERON_CLUSTER_MIXED_GO_LEADER_COMPOSE: "1"
    volumes:
      # Mount Java member baseDirs. Go leader reads service-probe files here.
      - cluster-data-0:/tmp/heron-cluster-0
      - cluster-data-1:/tmp/heron-cluster-1

  # Appoint Go member 2. Raise startup canvass so the appointed-leader guard
  # covers Go open after both Java peers are already canvassing.
  cluster-0:
    environment:
      HERON_CLUSTER_APPOINTED_LEADER_ID: "2"
      AERON_CLUSTER_STARTUP_CANVASS_TIMEOUT: "120s"

  cluster-1:
    environment:
      HERON_CLUSTER_APPOINTED_LEADER_ID: "2"
      AERON_CLUSTER_STARTUP_CANVASS_TIMEOUT: "120s"
