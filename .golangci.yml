version: "2"

run:
  timeout: 5m
  build-tags:
    - testhooks
    - rapid
    - bench
    - stress

formatters:
  enable:
    - goimports
    - gofumpt
  settings:
    goimports:
      local-prefixes:
        - github.com/warrenguy/heron
    gofumpt:
      extra-rules: true
      module-path: github.com/warrenguy/heron

linters:
  default: standard
  enable:
    - lll
    - testifylint
  exclusions:
    paths:
      - vendor
  settings:
    lll:
      line-length: 100
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1020
        - -ST1021
