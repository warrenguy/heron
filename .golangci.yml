version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      extra-rules: true
      module-path: github.com/warrenguy/heron

linters:
  default: standard
  enable:
    - lll
    - testifylint
  settings:
    lll:
      line-length: 100
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1020
        - -ST1021
