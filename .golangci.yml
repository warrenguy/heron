version: "2"

run:
  timeout: 5m
  build-tags:
    - testhooks
    - rapid
    - bench
    - stress
    - example

formatters:
  enable:
    - goimports
    - gofumpt
  settings:
    goimports:
      local-prefixes:
        - github.com/warrenguy/heron
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true
      module-path: github.com/warrenguy/heron

linters:
  default: standard
  enable:
    - exhaustive
    - gosec
    - lll
    - testifylint
  settings:
    lll:
      line-length: 100
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1020
        - -ST1021
  exclusions:
    rules:
      - path: '_test\.go$'
        linters:
          - exhaustive
      # Tests and test helpers handle no untrusted input.
      - path: '(_test\.go$|^test/|(^|/)internal/(testhook|testutil)/|/cnctest/|(^|/)test_hooks\.go$|_fixtures?(_bench)?\.go$)'
        linters:
          - gosec
      # Examples demonstrate the API and are not library code.
      - path: '^examples/'
        linters:
          - gosec
      # These packages open Aeron files at paths their callers supply.
      - path: '^(mmap|aeron/cnc|aeron/logbuffer|cluster/recordinglog)/'
        linters:
          - gosec
        text: 'G304:'
      # atomicbuffer exists to wrap unsafe.
      - path: '^atomicbuffer/'
        linters:
          - gosec
        text: 'G103:'

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
