version: "2"

run:
  timeout: 5m
  build-tags:
    - testhooks
    - rapid
    - bench
    - stress
    - example

formatters:
  enable:
    - goimports
    - gofumpt
  settings:
    goimports:
      local-prefixes:
        - github.com/warrenguy/heron
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true
      module-path: github.com/warrenguy/heron

linters:
  default: standard
  enable:
    - exhaustive
    - lll
    - testifylint
  settings:
    lll:
      line-length: 100
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1020
        - -ST1021
  exclusions:
    rules:
      - path: '_test\.go$'
        linters:
          - exhaustive

issues:
  max-same-issues: 0
