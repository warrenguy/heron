# Overlay: Go appointed leader (member 2). Java peers start first.
# Use with: docker compose -f compose.yaml -f compose.go-leader.yaml
#
# Start order:
# 1. aeronmd healthy
# 2. archive-go healthy
# 3. cluster-0 and cluster-1 healthy (cnc.dat present)
# 4. go-go-leader records Java commit counters, opens as appointed leader
# Java peers must not elect a term while the Go member is absent.
# Appointed leader 2 and a raised startup canvass timeout hold peers in canvass.

services:
  # Share the aeronmd network namespace. Member-2 endpoints (IP2:920x) must listen
  # in the C driver process. A separate container IP cannot hold those endpoints.
  # Volumes stay independent. The readiness file is on shared /dev/shm.
  go-go-leader:
    image: cluster-mixed-go-go-leader
    build:
      context: ../..
      dockerfile: docker/cluster_mixed/go/Dockerfile
      target: go-leader-runtime
      args:
        GO_VERSION: ${GO_VERSION:-1.26.4}
    user: "${HERON_COMPOSE_UID:-1000}:${HERON_COMPOSE_GID:-1000}"
    network_mode: "service:aeronmd"
    depends_on:
      aeronmd:
        condition: service_healthy
      archive-go:
        condition: service_healthy
      cluster-0:
        condition: service_healthy
      cluster-1:
        condition: service_healthy
    environment:
      AERON_TERM_BUFFER_LENGTH: "65536"
      AERON_IPC_TERM_BUFFER_LENGTH: "65536"
      AERON_DIR: /dev/shm/aeron-go
      HERON_CLUSTER_MIXED_GO_LEADER_COMPOSE: "1"

      # Member list matches the Java peers. Defaults follow HERON_CLUSTER_MIXED_IP{0,1,2}.
      HERON_CLUSTER_HOSTNAMES: ${HERON_CLUSTER_HOSTNAMES:-${HERON_CLUSTER_MIXED_IP0:-172.30.0.10},${HERON_CLUSTER_MIXED_IP1:-172.30.0.11},${HERON_CLUSTER_MIXED_IP2:-172.30.0.12}}

    volumes:
      - aeron-media:/dev/shm
      # Mount Java member baseDirs. Go leader reads service-probe files here.
      - cluster-data-0:/tmp/heron-cluster-0
      - cluster-data-1:/tmp/heron-cluster-1
      - cluster-data-2:/tmp/heron-cluster-2
    healthcheck:
      interval: 1s
      timeout: 5s
      retries: 60
      start_period: 5s
      test: ["CMD-SHELL", "test -f /dev/shm/heron-mixed/member-ready"]

  # Appoint Go member 2. Raise startup canvass so the appointed-leader guard
  # covers Go open after both Java peers are already canvassing.
  cluster-0:
    environment:
      HERON_CLUSTER_APPOINTED_LEADER_ID: "2"
      AERON_CLUSTER_STARTUP_CANVASS_TIMEOUT: "120s"

  cluster-1:
    environment:
      HERON_CLUSTER_APPOINTED_LEADER_ID: "2"
      AERON_CLUSTER_STARTUP_CANVASS_TIMEOUT: "120s"
