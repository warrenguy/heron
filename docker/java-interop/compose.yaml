# tmpfs mounts at /dev/shm (parent) so aeronmd can delete/recreate AERON_DIR
# subdirectory /dev/shm/aeron; mounting directly at that path blocks driver init.
x-app-user: &app-user "${HERON_COMPOSE_UID:-1000}:${HERON_COMPOSE_GID:-1000}"
# Must match logbuffer.TermMinLength / harness defaultDriverEnv.
x-aeron-env: &aeron-env
  AERON_DIR: /dev/shm/aeron
  AERON_TERM_BUFFER_LENGTH: "65536"
  AERON_IPC_TERM_BUFFER_LENGTH: "65536"
x-aeron-vols: &aeron-vols
  - aeron-media:/dev/shm

services:
  aeronmd:
    image: java-interop-aeronmd
    build:
      context: ../..
      dockerfile: docker/aeronmd/Dockerfile
      target: runtime
      args:
        AERON_REF: ${AERON_REF}
        AERON_REPOSITORY: ${AERON_REPOSITORY}
        AERON_DRIVER_ARTIFACT: ${AERON_DRIVER_ARTIFACT}
    user: *app-user
    environment: *aeron-env
    volumes: *aeron-vols
    healthcheck:
      test: ["CMD-SHELL", "test -f /dev/shm/aeron/cnc.dat"]
      interval: 1s
      timeout: 5s
      retries: 10
      start_period: 5s

  go:
    image: java-interop-go
    build:
      context: ../..
      dockerfile: docker/java-interop/go/Dockerfile
      args:
        GO_VERSION: ${GO_VERSION:-1.26.4}
    user: *app-user
    depends_on:
      aeronmd:
        condition: service_healthy
    environment:
      <<: *aeron-env
      HERON_JAVA_INTEROP_COMPOSE: "1"
    volumes: *aeron-vols

  java:
    image: java-interop-java
    build:
      context: ../..
      dockerfile: docker/java-interop/java/Dockerfile
    user: *app-user
    depends_on:
      aeronmd:
        condition: service_healthy
    environment: *aeron-env
    volumes: *aeron-vols

volumes:
  aeron-media:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=256m,mode=1777
