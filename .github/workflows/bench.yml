name: bench

# Bootstrap: first push to main must save BENCH_CACHE_KEY before PR restore can pass.
# Fork PRs skip bench-regression (cannot read base repo cache).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GOARCH: amd64
  BENCH_COUNT: 5
  GOMAXPROCS: 4
  BENCH_CACHE_KEY: bench-baseline-amd64

jobs:
  bench-baseline:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: bench-baseline
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"
          cache: true

      - name: Benchmark baseline
        run: make bench-baseline

      - uses: actions/cache/save@v5
        with:
          key: ${{ env.BENCH_CACHE_KEY }}
          path: .bench

  bench-regression:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    continue-on-error: true
    concurrency:
      group: bench-regression-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache/restore@v5
        with:
          key: ${{ env.BENCH_CACHE_KEY }}
          path: .bench
          fail-on-cache-miss: true

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"
          cache: true

      - name: Benchmark regression
        run: make bench-regression