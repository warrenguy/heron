name: bench

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BENCH_COUNT: 6
  BENCH_THRESHOLD: 30
  GOMAXPROCS: 4

jobs:
  bench-baseline:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix: &bench-archs
        include:
          - goarch: amd64
            runner: ubuntu-24.04
          - goarch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: bench-baseline-${{ matrix.goarch }}
      cancel-in-progress: true
    env: &bench-per-arch-env
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Benchmark baseline
        run: make bench-baseline

      - uses: actions/cache/save@v5
        with:
          key: bench-baseline-${{ matrix.goarch }}-main-${{ github.run_id }}
          path: .bench

  bench-regression:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix: *bench-archs
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    concurrency:
      group: bench-regression-${{ github.event.pull_request.number }}-${{ matrix.goarch }}
      cancel-in-progress: true
    env: *bench-per-arch-env
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache/restore@v5
        id: bench-cache
        with:
          key: bench-baseline-${{ matrix.goarch }}-main-${{ github.sha }}
          restore-keys: |
            bench-baseline-${{ matrix.goarch }}-main-
            bench-baseline-${{ matrix.goarch }}-
          path: .bench
          fail-on-cache-miss: true

      - name: Verify baseline cache
        run: |
          test -s .bench/baseline.txt
          grep -q '^Benchmark' .bench/baseline.txt
          echo "baseline cache key: ${{ steps.bench-cache.outputs.cache-matched-key }}"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Benchmark regression
        run: make bench-regression
