name: bench

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  BENCH_COUNT: 3
  BENCH_PAYLOAD_SIZES: 32,1400
  BENCH_THRESHOLD: 30
  GOMAXPROCS: 4

jobs:
  bench-baseline:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix: &bench-archs
        include:
          - goarch: amd64
            runner: ubuntu-24.04
          - goarch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env: &bench-per-arch-env
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Benchmark baseline
        run: make bench-baseline

      - uses: actions/cache/save@v6
        with:
          key: bench-baseline-${{ matrix.goarch }}-main-${{ github.sha }}
          path: .bench

  bench-regression:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix: *bench-archs
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: bench-regression-${{ github.event.pull_request.number }}-${{ matrix.goarch }}
      cancel-in-progress: true
    env: *bench-per-arch-env
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache/restore@v6
        id: bench-cache
        with:
          key: bench-baseline-${{ matrix.goarch }}-main-${{ github.event.pull_request.base.sha }}
          path: .bench
          fail-on-cache-miss: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Cache is a fast path. On a miss, generate a baseline from the PR base.
      - name: Ensure baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if test -s .bench/baseline.txt && grep -q '^Benchmark' .bench/baseline.txt; then
            echo "baseline cache key: ${{ steps.bench-cache.outputs.cache-matched-key }}"
          else
            echo "baseline cache missing or empty"
            rm -rf .bench
            git fetch --depth=1 origin "${BASE_SHA}"
            git worktree add --detach "${RUNNER_TEMP}/bench-base" "${BASE_SHA}"
            make -C "${RUNNER_TEMP}/bench-base" bench-baseline
            mv "${RUNNER_TEMP}/bench-base/.bench" .bench
            test -s .bench/baseline.txt
            grep -q '^Benchmark' .bench/baseline.txt
          fi

      - uses: actions/cache/save@v6
        if: steps.bench-cache.outputs.cache-hit != 'true'
        with:
          key: bench-baseline-${{ matrix.goarch }}-main-${{ github.event.pull_request.base.sha }}
          path: .bench

      - name: Benchmark regression
        run: make bench-regression

  bench-ok:
    if: always()
    needs: [bench-baseline, bench-regression]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Bench jobs passed
        env:
          EVENT: ${{ github.event_name }}
          BASELINE: ${{ needs.bench-baseline.result }}
          REGRESSION: ${{ needs.bench-regression.result }}
        run: |
          source .github/scripts/require-job-result.sh
          case "${EVENT}" in
          push)
            require_job bench-baseline "${BASELINE}"
            require_job bench-regression "${REGRESSION}" true
            ;;
          pull_request)
            require_job bench-regression "${REGRESSION}"
            require_job bench-baseline "${BASELINE}" true
            ;;
          *)
            echo "unexpected workflow event: ${EVENT}"
            exit 1
            ;;
          esac
          require_jobs_exit "bench jobs passed"
