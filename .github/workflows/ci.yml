name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GOARCH must match runner arch (see Makefile SUPPORTED_GOARCHES).
jobs:
  check:
    strategy: &go-matrix
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-24.04
          # - goarch: arm64
          #   runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env: &go-arch-env
      GOARCH: ${{ matrix.goarch }}
    steps:
      - &checkout-step
        uses: actions/checkout@v6

      - &go-arch-cache-marker-step
        name: Write Go arch cache marker
        run: echo "${{ env.GOARCH }}" > .go-arch-cache-marker

      - uses: actions/setup-go@v6
        with: &go-setup-with
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            .go-arch-cache-marker

      # amd64: Java, lint cache, shellcheck, and static checks (SBE, contract oracles).
      - uses: actions/setup-java@v5
        if: env.GOARCH == 'amd64'
        with:
          distribution: temurin
          java-version: 26
          cache: maven

      - uses: actions/cache@v5
        if: env.GOARCH == 'amd64'
        with:
          path: ~/.cache/golangci-lint
          key: golangci-${{ runner.os }}-${{ env.GOARCH }}-${{ hashFiles('.golangci.yml', 'go.sum') }}
          restore-keys: |
            golangci-${{ runner.os }}-${{ env.GOARCH }}-

      - name: Check static
        if: env.GOARCH == 'amd64'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck && make check-static

      - name: Check test
        run: make check-test

      - name: Property tests
        if: env.GOARCH == 'amd64'
        run: make test-rapid

  integration:
    needs: check
    strategy: *go-matrix
    runs-on: ${{ matrix.runner }}
    env: *go-arch-env
    steps:
      - *checkout-step
      - *go-arch-cache-marker-step

      - uses: actions/setup-go@v6
        with: *go-setup-with

      - uses: actions/cache@v5
        id: aeronmd-cache
        with:
          path: bin/aeronmd
          key: aeronmd-${{ env.GOARCH }}-${{ hashFiles('specs/versions.yaml', 'docker/aeronmd/Dockerfile', 'scripts/build-aeronmd.sh') }}

      - name: Refresh aeronmd mtime
        if: steps.aeronmd-cache.outputs.cache-hit == 'true'
        run: touch bin/aeronmd

      - name: Integration tests
        run: make test-integration
