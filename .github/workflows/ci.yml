name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GOARCH must match runner arch (see Makefile SUPPORTED_GOARCHES).
jobs:
  check:
    strategy: &go-matrix
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-24.04
          - goarch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v6

      - name: Write Go arch cache marker
        run: echo "${{ env.GOARCH }}" > .go-arch-cache-marker

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            .go-arch-cache-marker

      # Java on amd64 only: check-sbe-stale-optional (make check) and test-java-interop-unit.
      - uses: actions/setup-java@v4
        if: matrix.goarch == 'amd64'
        with:
          distribution: temurin
          java-version: 26
          cache: maven

      - uses: actions/cache@v4
        with:
          path: ~/.cache/golangci-lint
          key: golangci-${{ runner.os }}-${{ env.GOARCH }}-${{ hashFiles('.golangci.yml', 'go.sum') }}
          restore-keys: |
            golangci-${{ runner.os }}-${{ env.GOARCH }}-

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Check
        run: make check

      - name: Property tests
        if: matrix.goarch == 'amd64'
        run: make test-rapid

      - name: Java interop unit tests
        if: matrix.goarch == 'amd64'
        run: make test-java-interop-unit

      - name: Java interop Go oracle tests
        if: matrix.goarch == 'amd64'
        run: make test-java-interop-oracle

  integration:
    needs: check
    strategy: *go-matrix
    runs-on: ${{ matrix.runner }}
    env:
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v6

      - name: Write Go arch cache marker
        run: echo "${{ env.GOARCH }}" > .go-arch-cache-marker

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            .go-arch-cache-marker

      - uses: actions/cache@v4
        id: aeronmd-cache
        with:
          path: bin/aeronmd
          key: aeronmd-${{ matrix.goarch }}-${{ hashFiles('specs/versions.yaml', 'docker/aeronmd/Dockerfile', 'scripts/build-aeronmd.sh') }}

      - name: Refresh aeronmd mtime
        if: steps.aeronmd-cache.outputs.cache-hit == 'true'
        run: touch bin/aeronmd

      - name: Integration tests
        run: make test-integration
