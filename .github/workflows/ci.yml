name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# GOARCH must match runner arch (see Makefile SUPPORTED_GOARCHES).
jobs:
  lint:
    runs-on: ubuntu-24.04
    env: &amd64-env
      GOARCH: amd64
    steps:
      - &checkout-step
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - uses: actions/cache@v6
        with:
          path: ~/.cache/golangci-lint
          key: golangci-${{ runner.os }}-${{ env.GOARCH }}-${{ hashFiles('.golangci.yml', 'go.sum', 'tools/go.sum') }}
          restore-keys: |
            golangci-${{ runner.os }}-${{ env.GOARCH }}-

      - name: Lint
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck && make lint

  oracles:
    runs-on: ubuntu-24.04
    env: *amd64-env
    steps:
      - *checkout-step
      - uses: ./.github/actions/setup
        with:
          java: true

      - name: Drift checks and contract oracles
        run: make check-drift check-oracles

  unit:
    strategy: &go-matrix
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-24.04
          - goarch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env: &go-arch-env
      GOARCH: ${{ matrix.goarch }}
    steps:
      - *checkout-step
      - uses: ./.github/actions/setup

      - name: Check test
        run: make check-test

  property:
    runs-on: ubuntu-24.04
    env: *amd64-env
    steps:
      - *checkout-step
      - uses: ./.github/actions/setup

      - name: Property tests
        run: make test-rapid

  election-sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env: *amd64-env
    steps:
      - *checkout-step
      - uses: ./.github/actions/setup
      - name: Election sim soak
        env:
          ELECTION_SIM_RUNS: "1000"
          LUAS_SIM_SAVE: "1"
        run: make test-election-sim
      - name: Upload election-sim failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: election-sim-failures
          path: test/sim/testdata/sim/failures/
          if-no-files-found: ignore

  replication-sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env: *amd64-env
    steps:
      - *checkout-step
      - uses: ./.github/actions/setup
      - name: Replication sim soak
        env:
          REPLICATION_SIM_RUNS: "180"
          LUAS_SIM_SAVE: "1"
        run: make test-replication-sim
      - name: Upload replication-sim failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: replication-sim-failures
          path: test/sim/testdata/sim/failures/
          if-no-files-found: ignore

  integration:
    strategy: *go-matrix
    runs-on: ${{ matrix.runner }}
    env: *go-arch-env
    steps:
      - *checkout-step
      - uses: ./.github/actions/setup
        with:
          aeronmd: true

      - name: Integration tests
        run: make test-integration

  docker-smokes-list:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env: *amd64-env
    outputs:
      smokes: ${{ steps.list.outputs.smokes }}
    steps:
      - *checkout-step
      - uses: ./.github/actions/setup

      - name: List smoke-* Makefile targets
        id: list
        run: |
          set -o pipefail
          smokes=$(make -s smokes-list | sed 's/^smoke-//' | jq -Rnc '[inputs]')
          echo "smokes=${smokes}" >> "$GITHUB_OUTPUT"

  docker-smokes:
    needs: docker-smokes-list
    strategy:
      fail-fast: false
      matrix:
        smoke: ${{ fromJSON(needs.docker-smokes-list.outputs.smokes) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env: *amd64-env
    steps:
      - *checkout-step
      - uses: ./.github/actions/setup
        with:
          aeronmd: true

      - name: Docker smoke
        run: make smoke-${{ matrix.smoke }}

  cluster-archive:
    strategy: *go-matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env: *go-arch-env
    steps:
      - *checkout-step
      - uses: ./.github/actions/setup
        with:
          java: true
          aeronmd: true

      - name: Live Archive cluster tests
        run: make test-cluster-archive

      - name: Upload cluster archive artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cluster-archive-artifacts-${{ matrix.goarch }}
          path: .artifacts/cluster-archive/
          if-no-files-found: ignore

  # A short run on a fixed seed checks that the soak itself still works.
  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env: *amd64-env
    steps:
      - *checkout-step
      - uses: ./.github/actions/setup
        with:
          java: true
          aeronmd: true

      - name: Prepare namespaces
        run: .github/scripts/prepare-soak-namespaces.sh

      - name: Live soak
        env:
          LUAS_SOAK_SEED: "9012209"
          LUAS_SOAK_DURATION: 1m
        run: make test-soak SOAK_TEST_TIMEOUT=25m

      # A skipped soak exits 0 and writes no result.
      - name: Require result rows
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          for row in soak-result.json; do
            if [ -z "$(find .artifacts/soak -name "${row}")" ]; then
              echo "::error::missing ${row}"
              exit 1
            fi
          done
          {
            echo '```json'
            find .artifacts/soak -name soak-result.json -exec cat {} +
            printf '\n```\n'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload soak failure bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: soak-failure-attempt-${{ github.run_attempt }}
          path: .artifacts/soak/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 30

  ci-ok:
    if: always()
    needs: [lint, oracles, unit, property, election-sim, replication-sim, integration, docker-smokes, cluster-archive, soak]
    runs-on: ubuntu-24.04
    steps:
      - *checkout-step
      - name: All required jobs passed
        env:
          LINT: ${{ needs.lint.result }}
          ORACLES: ${{ needs.oracles.result }}
          UNIT: ${{ needs.unit.result }}
          PROPERTY: ${{ needs.property.result }}
          ELECTION_SIM: ${{ needs.election-sim.result }}
          REPLICATION_SIM: ${{ needs.replication-sim.result }}
          INTEGRATION: ${{ needs.integration.result }}
          DOCKER_SMOKES: ${{ needs.docker-smokes.result }}
          CLUSTER_ARCHIVE: ${{ needs.cluster-archive.result }}
          SOAK: ${{ needs.soak.result }}
        run: |
          source .github/scripts/require-job-result.sh
          require_job lint "${LINT}"
          require_job oracles "${ORACLES}"
          require_job unit "${UNIT}"
          require_job property "${PROPERTY}"
          require_job election-sim "${ELECTION_SIM}"
          require_job replication-sim "${REPLICATION_SIM}"
          require_job integration "${INTEGRATION}"
          require_job docker-smokes "${DOCKER_SMOKES}"
          require_job cluster-archive "${CLUSTER_ARCHIVE}"
          require_job soak "${SOAK}"
          require_jobs_exit "all required jobs passed"
