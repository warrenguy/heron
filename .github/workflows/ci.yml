name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GOARCH must match runner arch (see Makefile SUPPORTED_GOARCHES).
jobs:
  check:
    strategy: &go-matrix
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache: true

      - name: Check
        run: make check

  integration:
    strategy: *go-matrix
    runs-on: ${{ matrix.runner }}
    env:
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache: true

      - name: Integration tests
        run: make test-integration