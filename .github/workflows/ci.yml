name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# GOARCH must match runner arch (see Makefile SUPPORTED_GOARCHES).
jobs:
  lint:
    runs-on: ubuntu-24.04
    env: &amd64-env
      GOARCH: amd64
    steps:
      - &checkout-step
        uses: actions/checkout@v6

      - &go-arch-cache-marker-step
        name: Write Go arch cache marker
        run: echo "${{ env.GOARCH }}" > .go-arch-cache-marker

      - &setup-go-step
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            .go-arch-cache-marker

      - uses: actions/cache@v5
        with:
          path: ~/.cache/golangci-lint
          key: golangci-${{ runner.os }}-${{ env.GOARCH }}-${{ hashFiles('.golangci.yml', 'go.sum') }}
          restore-keys: |
            golangci-${{ runner.os }}-${{ env.GOARCH }}-

      - name: Lint
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck && make lint

  oracles:
    runs-on: ubuntu-24.04
    env: *amd64-env
    steps:
      - *checkout-step
      - *go-arch-cache-marker-step
      - *setup-go-step

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 26
          cache: maven

      - name: Contract oracles and stale checks
        run: make check-static-extra

  unit:
    strategy: &go-matrix
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-24.04
          # - goarch: arm64
          #   runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env: &go-arch-env
      GOARCH: ${{ matrix.goarch }}
    steps:
      - *checkout-step
      - *go-arch-cache-marker-step
      - *setup-go-step

      - name: Check test
        run: make check-test

  property:
    runs-on: ubuntu-24.04
    env: *amd64-env
    steps:
      - *checkout-step
      - *go-arch-cache-marker-step
      - *setup-go-step

      - name: Property tests
        run: make test-rapid

  integration:
    if: &skip-drafts github.event_name == 'push' || github.event.pull_request.draft == false
    strategy: *go-matrix
    runs-on: ${{ matrix.runner }}
    env: *go-arch-env
    steps:
      - *checkout-step
      - *go-arch-cache-marker-step
      - *setup-go-step

      - uses: actions/cache@v5
        id: aeronmd-cache
        with:
          path: bin/aeronmd
          key: aeronmd-${{ env.GOARCH }}-${{ hashFiles('specs/versions.yaml', 'docker/aeronmd/Dockerfile', 'scripts/build-aeronmd.sh') }}

      - name: Refresh aeronmd mtime
        if: steps.aeronmd-cache.outputs.cache-hit == 'true'
        run: touch bin/aeronmd

      - name: Integration tests
        run: make test-integration

  docker-smokes:
    if: *skip-drafts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env: *amd64-env
    steps:
      - *checkout-step
      - *go-arch-cache-marker-step
      - *setup-go-step

      - name: Docker smokes
        run: |
          make test-java-interop
          make test-cluster-java
          make test-cluster-java-failover

  ci-ok:
    if: always()
    needs: [lint, oracles, unit, property, integration, docker-smokes]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required jobs
        run: |
          for r in ${{ join(needs.*.result, ' ') }}; do
            case "$r" in
              success|skipped) ;;
              *) echo "required job concluded: $r"; exit 1 ;;
            esac
          done
