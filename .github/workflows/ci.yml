name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# GOARCH must match runner arch (see Makefile SUPPORTED_GOARCHES).
jobs:
  lint:
    runs-on: ubuntu-24.04
    env: &amd64-env
      GOARCH: amd64
    steps:
      - &checkout-step
        uses: actions/checkout@v7

      - &go-arch-cache-marker-step
        name: Write Go arch cache marker
        run: echo "${{ env.GOARCH }}" > .go-arch-cache-marker

      - &setup-go-step
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            .go-arch-cache-marker

      - uses: actions/cache@v6
        with:
          path: ~/.cache/golangci-lint
          key: golangci-${{ runner.os }}-${{ env.GOARCH }}-${{ hashFiles('.golangci.yml', 'go.sum') }}
          restore-keys: |
            golangci-${{ runner.os }}-${{ env.GOARCH }}-

      - name: Lint
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck && make lint

  oracles:
    if: &skip-drafts github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    env: *amd64-env
    steps:
      - *checkout-step
      - *go-arch-cache-marker-step
      - *setup-go-step

      - &setup-java-step
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 26
          cache: maven

      # setup-java does not install mvn. Pin 3.9.x (Makefile needs 3.8.2+).
      - &install-maven-step
        name: Install Maven
        env:
          MAVEN_VERSION: "3.9.16"
          MAVEN_SHA512: "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6"
        run: |
          set -euo pipefail
          tarball="${RUNNER_TEMP}/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          curl -fsSL -o "${tarball}" "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          echo "${MAVEN_SHA512}  ${tarball}" | sha512sum -c -
          sudo tar -xzC /opt -f "${tarball}"
          echo "/opt/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"
          "/opt/apache-maven-${MAVEN_VERSION}/bin/mvn" -v

      - name: Contract oracles and stale checks
        run: make check-static-extra

  unit:
    strategy: &go-matrix
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-24.04
          - goarch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env: &go-arch-env
      GOARCH: ${{ matrix.goarch }}
    steps:
      - *checkout-step
      - *go-arch-cache-marker-step
      - *setup-go-step

      - name: Check test
        run: make check-test

  property:
    runs-on: ubuntu-24.04
    env: *amd64-env
    steps:
      - *checkout-step
      - *go-arch-cache-marker-step
      - *setup-go-step

      - name: Property tests
        run: make test-rapid

  election-sim:
    if: *skip-drafts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env: *amd64-env
    steps:
      - *checkout-step
      - *go-arch-cache-marker-step
      - *setup-go-step
      - name: Election sim soak
        env:
          ELECTION_SIM_RUNS: "1000"
          HERON_SIM_SAVE: "1"
        run: make test-election-sim
      - name: Upload election-sim failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: election-sim-failures
          path: test/sim/testdata/sim/failures/
          if-no-files-found: ignore

  replication-sim:
    if: *skip-drafts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env: *amd64-env
    steps:
      - *checkout-step
      - *go-arch-cache-marker-step
      - *setup-go-step
      - name: Replication sim soak
        env:
          REPLICATION_SIM_RUNS: "180"
          HERON_SIM_SAVE: "1"
        run: make test-replication-sim
      - name: Upload replication-sim failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: replication-sim-failures
          path: test/sim/testdata/sim/failures/
          if-no-files-found: ignore

  integration:
    if: *skip-drafts
    strategy: *go-matrix
    runs-on: ${{ matrix.runner }}
    env: *go-arch-env
    steps:
      - *checkout-step
      - *go-arch-cache-marker-step
      - *setup-go-step

      - &aeronmd-cache-step
        uses: actions/cache@v6
        id: aeronmd-cache
        with:
          path: bin/aeronmd
          key: aeronmd-${{ env.GOARCH }}-${{ hashFiles('specs/versions.yaml', 'docker/aeronmd/Dockerfile', 'scripts/build-aeronmd.sh') }}

      - &aeronmd-cache-touch-step
        name: Refresh aeronmd mtime
        if: steps.aeronmd-cache.outputs.cache-hit == 'true'
        run: touch bin/aeronmd

      - name: Integration tests
        run: make test-integration

  docker-smokes:
    if: *skip-drafts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env: *amd64-env
    steps:
      - *checkout-step
      - *go-arch-cache-marker-step
      - *setup-go-step
      - *aeronmd-cache-step
      - *aeronmd-cache-touch-step

      - name: Docker smokes
        run: |
          make aeronmd-compose-image
          make test-docker-smokes

  cluster-archive:
    if: *skip-drafts
    strategy: *go-matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env: *go-arch-env
    steps:
      - *checkout-step
      - *go-arch-cache-marker-step
      - *setup-go-step
      - *setup-java-step
      - *install-maven-step
      - *aeronmd-cache-step
      - *aeronmd-cache-touch-step

      - name: Live Archive cluster tests
        run: make test-cluster-archive

  ci-ok:
    if: |
      always() && (
        github.event_name != 'pull_request' ||
        github.event.pull_request.draft == false
      )
    needs: [lint, oracles, unit, property, election-sim, replication-sim, integration, docker-smokes, cluster-archive]
    runs-on: ubuntu-24.04
    steps:
      - *checkout-step
      - name: All required jobs passed
        env:
          LINT: ${{ needs.lint.result }}
          ORACLES: ${{ needs.oracles.result }}
          UNIT: ${{ needs.unit.result }}
          PROPERTY: ${{ needs.property.result }}
          ELECTION_SIM: ${{ needs.election-sim.result }}
          REPLICATION_SIM: ${{ needs.replication-sim.result }}
          INTEGRATION: ${{ needs.integration.result }}
          DOCKER_SMOKES: ${{ needs.docker-smokes.result }}
          CLUSTER_ARCHIVE: ${{ needs.cluster-archive.result }}
        run: |
          source .github/scripts/require-job-result.sh
          require_job lint "${LINT}"
          require_job oracles "${ORACLES}"
          require_job unit "${UNIT}"
          require_job property "${PROPERTY}"
          require_job election-sim "${ELECTION_SIM}"
          require_job replication-sim "${REPLICATION_SIM}"
          require_job integration "${INTEGRATION}"
          require_job docker-smokes "${DOCKER_SMOKES}"
          require_job cluster-archive "${CLUSTER_ARCHIVE}"
          require_jobs_exit "all required jobs passed"
