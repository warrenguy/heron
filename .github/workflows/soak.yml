name: soak

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: Decimal schedule seed. Empty draws a new seed.
      duration:
        description: Go duration of the fault run. Empty means 30m. At most 34m.

permissions:
  contents: read

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: false

# GOARCH must match runner arch (see Makefile SUPPORTED_GOARCHES).
jobs:
  soak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-24.04
          - goarch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 80
    env:
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          java: true
          aeronmd: true

      - name: Prepare namespaces
        id: prepare
        run: .github/scripts/prepare-soak-namespaces.sh

      - name: Live soak
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          LUAS_SOAK_SEED: ${{ inputs.seed }}
          LUAS_SOAK_DURATION: ${{ inputs.duration }}
        run: make test-soak

      - name: Require result rows
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          for row in soak-result.json; do
            if [ -z "$(find .artifacts/soak -name "${row}")" ]; then
              echo "::error::missing ${row}"
              exit 1
            fi
          done
          {
            echo '```json'
            find .artifacts/soak -name soak-result.json -exec cat {} +
            printf '\n```\n'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload failure bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: soak-failure-${{ env.GOARCH }}-attempt-${{ github.run_attempt }}
          path: .artifacts/soak/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 30
