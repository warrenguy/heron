name: soak

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: Decimal schedule seed. Empty draws a new seed.
      duration:
        description: Go duration of the fault run. Empty means 30m. At most 34m.

permissions:
  contents: read

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: false

# GOARCH must match runner arch (see Makefile SUPPORTED_GOARCHES).
jobs:
  soak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-24.04
          - goarch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 80
    env:
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7

      - name: Write Go arch cache marker
        run: echo "${{ env.GOARCH }}" > .go-arch-cache-marker

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            .go-arch-cache-marker

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 26
          cache: maven

      # setup-java does not install mvn. Pin 3.9.x (Makefile needs 3.8.2+).
      - name: Install Maven
        env:
          MAVEN_VERSION: "3.9.16"
          MAVEN_SHA512: "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6"
        run: |
          set -euo pipefail
          tarball="${RUNNER_TEMP}/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors --connect-timeout 15 -o "${tarball}" "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${MAVEN_VERSION}/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          echo "${MAVEN_SHA512}  ${tarball}" | sha512sum -c -
          sudo tar -xzC /opt -f "${tarball}"
          echo "/opt/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"
          "/opt/apache-maven-${MAVEN_VERSION}/bin/mvn" -v

      - uses: actions/cache@v6
        id: aeronmd-cache
        with:
          path: bin/aeronmd
          key: aeronmd-${{ env.GOARCH }}-${{ hashFiles('specs/versions.yaml', 'test/integration/docker/aeronmd/Dockerfile', 'scripts/build-aeronmd.sh') }}

      - name: Refresh aeronmd mtime
        if: steps.aeronmd-cache.outputs.cache-hit == 'true'
        run: touch bin/aeronmd

      - name: Prepare namespaces
        id: prepare
        run: .github/scripts/prepare-soak-namespaces.sh

      - name: Live soak
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          LUAS_SOAK_SEED: ${{ inputs.seed }}
          LUAS_SOAK_DURATION: ${{ inputs.duration }}
        run: make test-soak

      - name: Require result rows
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          for row in soak-result.json; do
            if [ -z "$(find .artifacts/soak -name "${row}")" ]; then
              echo "::error::missing ${row}"
              exit 1
            fi
          done
          {
            echo '```json'
            find .artifacts/soak -name soak-result.json -exec cat {} +
            printf '\n```\n'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload failure bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: soak-failure-${{ env.GOARCH }}-attempt-${{ github.run_attempt }}
          path: .artifacts/soak/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 30
