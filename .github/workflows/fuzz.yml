name: fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# GOARCH must match runner arch (see Makefile SUPPORTED_GOARCHES).
env:
  GOARCH: amd64

jobs:
  targets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      run: ${{ steps.changes.outputs.run }}
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # A PR run fuzzes only when the PR changes the workflow, the Makefile, or a fuzz file.
      - name: Detect fuzz changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          run=true
          if [ "${EVENT}" = pull_request ] && git diff --quiet HEAD^1 HEAD -- \
            .github/workflows/fuzz.yml Makefile ':(glob)**/*_fuzz_test.go'; then
            run=false
          fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"

      - if: steps.changes.outputs.run == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: List fuzz targets
        if: steps.changes.outputs.run == 'true'
        id: list
        run: |
          set -euo pipefail
          matrix=$(make fuzz-list | jq -Rnc '[inputs | split(" ") as [$pkg, $name]
            | {pkg: $pkg, name: $name,
               id: (($pkg | ltrimstr("./") | gsub("/"; "-")) + "-" + $name)}]')
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: targets
    if: needs.targets.outputs.run == 'true'
    name: fuzz ${{ matrix.pkg }} ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 15 || 42 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      FUZZ_PKG: ${{ matrix.pkg }}
      FUZZ_NAME: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Locate fuzz corpus
        id: corpus
        run: echo "dir=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"

      - id: corpus-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.corpus.outputs.dir }}
          key: fuzz-corpus-${{ runner.os }}-${{ env.GOARCH }}-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuzz-corpus-${{ runner.os }}-${{ env.GOARCH }}-${{ matrix.id }}-

      - name: Fuzz
        run: make fuzz ${{ github.event_name != 'pull_request' && 'FUZZ_TIME=30m FUZZ_MINIMIZE_TIME=60s' || '' }}

      - name: Save fuzz corpus
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.corpus.outputs.dir }}
          key: ${{ steps.corpus-cache.outputs.cache-primary-key }}

      - name: Collect crashers
        if: failure()
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/fuzz-crashers"
          mkdir -p "${dest}"
          git ls-files -z --others --exclude-standard \
            -- ':(glob)**/testdata/fuzz/**' \
            | xargs -0 -r cp --parents -t "${dest}"
          {
            echo "### Fuzz crashers"
            (cd "${dest}" && find . -type f | sort)
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashers-${{ matrix.id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fuzz-crashers/
          if-no-files-found: ignore
          retention-days: 30

  fuzz-ok:
    if: always()
    needs: [targets, fuzz]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Fuzz jobs passed
        env:
          TARGETS: ${{ needs.targets.result }}
          FUZZ: ${{ needs.fuzz.result }}
        run: |
          source .github/scripts/require-job-result.sh
          require_job targets "${TARGETS}"
          require_job fuzz "${FUZZ}" true
          require_jobs_exit "fuzz jobs passed"
